<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' character:; connect-src character:; worker-src 'self'">
<title>Codex Quota Widget</title><link rel="stylesheet" href="style.css"></head>
<body>
<button id="widget" tabindex="-1" aria-label="额度挂件，拖动移动，点击展开详情"><div id="character-stage"><canvas id="character-canvas" width="288" height="160"></canvas></div><small id="window-label"></small><div class="compact-line"><div id="compact-track" class="track"><div id="compact-fill" class="fill"></div></div><strong id="status">暂无可用额度数据</strong></div></button>
<section id="details" hidden aria-label="额度与用量详情"><header><nav role="tablist" aria-label="详情视图"><button id="quota-tab" role="tab" aria-selected="true" aria-controls="quota-panel" tabindex="-1">套餐限额</button><button id="token-tab" role="tab" aria-selected="false" aria-controls="token-panel" tabindex="-1">token 用量</button><button id="character-tab" role="tab" aria-selected="false" aria-controls="character-panel" tabindex="-1">角色</button></nav><button id="close" tabindex="-1" aria-label="收起详情">×</button></header>
<div id="quota-panel" role="tabpanel" aria-labelledby="quota-tab"><div id="cards"></div><p id="metadata"></p><footer>Codex / Work / 工作空间智能体 / ChatGPT for Excel 共享池。<br>Chat 模式下的对话不计入此用量。<br>数据来自 Codex 自己的额度接口，非本插件估算。</footer></div>
<div id="token-panel" role="tabpanel" aria-labelledby="token-tab" hidden><p id="token-coverage" role="status">索引中</p><p id="token-unit">单位：token</p><div id="token-chart" role="img" aria-label="最近 24 小时、7 天、30 天 token 用量"></div><p id="token-updated"></p><footer id="token-statement">本机现存会话的汇总，并非 OpenAI 账户官方统计；<br>不含已删除会话及其他电脑上的会话。</footer></div>
<div id="character-panel" role="tabpanel" aria-labelledby="character-tab" hidden><div id="character-list"></div><div class="character-actions"><button id="character-new" tabindex="-1">新建</button><button id="character-rename" tabindex="-1">更名</button><button id="character-delete" tabindex="-1">删除</button></div><div id="character-slots"></div><label class="character-option">大小 <input id="character-size" type="range" min="180" max="420" step="1" tabindex="-1"><output id="character-size-value">280px</output></label><label class="character-option"><input id="character-background" type="checkbox" tabindex="-1" checked>自动去背景</label><div class="character-previews"><figure><img id="character-original" alt="原图预览"><figcaption>原图</figcaption></figure><figure><canvas id="character-processed" width="240" height="180"></canvas><figcaption>显示效果</figcaption></figure></div><p id="character-processing" role="status"></p><label class="character-option">取景缩放 <input id="character-zoom" type="range" min="0.5" max="3" step="0.05" tabindex="-1"><output id="character-zoom-value">1×</output></label><p class="character-help">拖动右侧预览平移取景，常驻角色实时更新。</p><button id="character-reset" tabindex="-1">重置取景</button><button id="position-reset" tabindex="-1">重置位置</button><p id="character-error" role="alert"></p><footer id="character-notice">请上传你有权使用的图片。素材保存在本机，不会上传。</footer></div></section>
<script src="view-model.js"></script><script src="character-view.js"></script><script src="image-player.js"></script><script src="renderer.js"></script><script src="character-settings.js"></script></body></html>
