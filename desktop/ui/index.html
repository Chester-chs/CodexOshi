<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'">
<title>Codex Quota Widget</title><link rel="stylesheet" href="style.css"></head>
<body>
<button id="widget" tabindex="-1" aria-label="额度挂件，拖动移动，点击展开详情"><span class="character">◉</span><small id="window-label"></small><div class="compact-line"><div id="compact-track" class="track"><div id="compact-fill" class="fill"></div></div><strong id="status">暂无可用额度数据</strong></div></button>
<section id="details" hidden aria-label="套餐限额详情"><header><strong>套餐限额</strong><button id="close" tabindex="-1" aria-label="收起详情">×</button></header><div id="cards"></div><p id="metadata"></p><footer>Codex / Work / 工作空间智能体 / ChatGPT for Excel 共享池。<br>Chat 模式下的对话不计入此用量。<br>数据来自 Codex 自己的额度接口，非本插件估算。</footer></section>
<script src="view-model.js"></script><script src="renderer.js"></script></body></html>
